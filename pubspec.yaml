name: success_app
description: A habit tracking app with SLM assistant integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Database - Supabase for online/cross-platform support
  supabase_flutter: ^2.5.6
  
  # Local Database (fallback for mobile)
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.2
  path: ^1.8.3
  path_provider: ^2.1.2
  
  # HTTP for API calls
  http: ^1.1.0
  
  # Date formatting
  intl: ^0.18.1
  
  # Utilities
  cupertino_icons: ^1.0.6
  
  # Environment variables
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # Assets for environment variables
  assets:
    - .env

